<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHIL QUIZ ARENA UPGRADED</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Orbitron',sans-serif;background:linear-gradient(135deg,#020617,#0f172a,#1e293b);color:#fff;min-height:100vh;overflow-x:hidden}
.container{width:95%;max-width:1500px;margin:auto;padding:20px}
.hidden{display:none!important}
.title{text-align:center;font-size:3rem;font-weight:900;margin:20px 0;color:#00e5ff;text-shadow:0 0 20px #00e5ff}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border-radius:25px;padding:25px;margin-top:20px;border:1px solid rgba(255,255,255,.08)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.profile{display:flex;align-items:center;gap:15px}
.profile img{width:65px;height:65px;border-radius:50%;object-fit:cover;border:3px solid #00e5ff}
.dashboard-buttons,.host-actions,.score-buttons,.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}
.big-btn{height:120px;font-size:1.2rem;font-weight:900}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
input,button,textarea,select{width:100%;padding:15px;margin-top:10px;border:none;border-radius:15px;font-family:'Orbitron',sans-serif;font-size:1rem}
input,textarea,select{background:#111827;color:#fff}
button{background:linear-gradient(135deg,#00e5ff,#ff00d4);color:#fff;cursor:pointer;font-weight:700;transition:.25s}
button:hover{transform:scale(1.02)}
.logout-btn{background:#dc2626;width:auto;padding:12px 18px}
.back-btn{background:#2563eb;width:auto;padding:12px 18px}
.warn-btn{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.safe-btn{background:linear-gradient(135deg,#10b981,#06b6d4)}
.dark-btn{background:linear-gradient(135deg,#334155,#0f172a)}
.avatar-preview{width:120px;height:120px;border-radius:50%;display:block;margin:auto;object-fit:cover;border:4px solid #00e5ff}
.room-code,.section-title,.question,.timer,.winner{text-align:center}
.room-code{font-size:2rem;color:#00e5ff;margin-top:10px;word-break:break-word}
.question{font-size:2rem;margin-top:20px;color:#00e5ff}
.buzzer{width:240px;height:240px;border-radius:50%;margin:30px auto;display:block;font-size:3rem;font-weight:900;background:radial-gradient(circle,#ffe600,#ff9800);color:#000;box-shadow:0 0 50px #ffe600}
.locked{background:#555!important;box-shadow:none!important}
.player{display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(255,255,255,.05);border-radius:16px;margin-top:10px;gap:10px;flex-wrap:wrap}
.player-left{display:flex;align-items:center;gap:12px}
.player-left img{width:55px;height:55px;border-radius:50%;object-fit:cover}
.timer{font-size:2rem;margin-top:15px;color:#ffe600}
.winner{font-size:1.1rem;margin-top:15px;color:#00ff99}
.question-image{width:100%;max-height:350px;object-fit:contain;margin-top:20px;border-radius:20px;display:none;background:#000}
.qr-box{background:#fff;padding:15px;border-radius:20px;width:230px;margin:auto;margin-top:20px;min-height:230px;display:flex;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:16px;margin-top:15px}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:.8rem;background:#0ea5e9;color:#fff}
.muted{color:#cbd5e1;font-size:.9rem}
.log-box{max-height:220px;overflow:auto}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table th,.table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:.9rem}
.small-note{text-align:center;margin-top:12px;font-size:.9rem;color:#cbd5e1;word-break:break-all}
.kick-btn{width:auto;padding:10px 12px;background:linear-gradient(135deg,#f43f5e,#b91c1c)}
.inline-row{display:flex;gap:10px;flex-wrap:wrap}.inline-row>*{flex:1}
@media(max-width:900px){.dashboard-buttons,.host-actions,.score-buttons,.mode-grid,.grid{grid-template-columns:1fr}.title{font-size:2rem}.buzzer{width:200px;height:200px;font-size:2rem}}
</style>
</head>
<body>
<div class="container">
<h1 class="title">MAHIL QUIZ ARENA</h1>

<div id="loginPage" class="glass">
<h2>LOGIN</h2>
<input type="text" id="loginUsername" placeholder="Username">
<input type="password" id="loginPassword" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button onclick="showSignup()">SIGN UP</button>
</div>

<div id="signupPage" class="glass hidden">
<div class="topbar"><button class="back-btn" onclick="showLogin()">⬅ BACK</button></div>
<h2>CREATE ACCOUNT</h2>
<input type="text" id="signupUsername" placeholder="Username">
<input type="email" id="signupEmail" placeholder="Email">
<input type="password" id="signupPassword" placeholder="Password">
<img id="avatarPreview" class="avatar-preview" src="https://i.pravatar.cc/150?img=12" alt="Avatar preview">
<input type="file" id="avatarInput" accept="image/*">
<button onclick="signup()">CREATE ACCOUNT</button>
</div>

<div id="dashboard" class="glass hidden">
<div class="topbar">
<div class="profile">
<img id="profileAvatar" alt="Profile avatar">
<div><h2 id="profileName"></h2><p id="profileEmail"></p></div>
</div>
<button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>
<div class="dashboard-buttons">
<button class="big-btn" onclick="hostGame()">HOST GAME</button>
<button class="big-btn" onclick="openJoinPage()">PLAY GAME</button>
<button class="big-btn" onclick="openSettings()">SETTINGS</button>
<button class="big-btn warn-btn" onclick="clearRooms()">CLEAR ROOMS</button>
</div>
</div>

<div id="joinPage" class="glass hidden">
<div class="topbar"><button class="back-btn" onclick="goDashboard()">⬅ BACK</button><h2>JOIN ROOM</h2></div>
<input type="text" id="joinCode" placeholder="Enter Room Code">
<button onclick="joinGame()">JOIN ROOM</button>
</div>

<div id="settingsPage" class="glass hidden">
<div class="topbar"><button class="back-btn" onclick="goDashboard()">⬅ BACK</button><h2>SETTINGS</h2></div>
<input type="text" id="changeName" placeholder="Change Username">
<input type="file" id="changeAvatar" accept="image/*">
<select id="soundSelect">
<option value="1">Classic Buzz</option>
<option value="2">Electric Buzz</option>
<option value="3">Game Show</option>
<option value="4">Laser Buzz</option>
<option value="5">Cyber Buzz</option>
</select>
<button onclick="saveSettings()">SAVE SETTINGS</button>
</div>

<div id="hostPage" class="glass hidden">
<div class="topbar"><button class="back-btn" onclick="goDashboard()">⬅ BACK</button><h2>HOST PANEL</h2></div>
<div class="room-code" id="roomCode">ROOM CODE:</div>
<div class="qr-box"><div id="qrcode"></div></div>
<div class="small-note" id="joinLinkNote"></div>

<div class="card">
<div class="section-title"><span class="badge" id="modeBadge">NORMAL MODE</span></div>
<div class="mode-grid">
<button onclick="setGameMode('normal')">NORMAL MODE</button>
<button onclick="setGameMode('tournament')">TOURNAMENT MODE</button>
<button onclick="setScoreMode('individual')">INDIVIDUAL SCORE</button>
<button onclick="setScoreMode('team')">TEAM SCORE</button>
</div>
<div class="inline-row">
<input type="text" id="tournamentName" placeholder="Tournament Name">
<input type="number" id="maxRounds" placeholder="Rounds" min="1" value="3">
</div>
<button class="safe-btn" onclick="startTournament()">START TOURNAMENT</button>
</div>

<textarea id="questionInput" placeholder="Enter Question"></textarea>
<input type="file" id="questionImageInput" accept="image/*">

<div class="host-actions">
<button onclick="sendQuestion()">SEND QUESTION</button>
<button onclick="startTimer()">START TIMER</button>
<button class="warn-btn" onclick="lockBuzzers()">LOCK BUZZERS</button>
<button class="safe-btn" onclick="unlockBuzzers()">UNLOCK BUZZERS</button>
<button onclick="resetBuzzers()">RESET BUZZERS</button>
<button class="dark-btn" onclick="advanceTournamentRound()">NEXT ROUND</button>
</div>

<div class="score-buttons">
<button onclick="addPoints()">+10 POINTS</button>
<button onclick="minusPoints()">-10 POINTS</button>
<button onclick="addTeamPoints()">+10 TEAM</button>
<button onclick="minusTeamPoints()">-10 TEAM</button>
</div>

<div class="timer" id="timer">10</div>
<div class="winner" id="winner"></div>

<div class="grid" style="margin-top:20px">
<div>
<div class="card">
<h2>LIVE SCOREBOARD</h2>
<div id="hostScoreboard"></div>
</div>
<div class="card">
<h2>TEAMS</h2>
<div class="inline-row">
<input type="text" id="teamNameInput" placeholder="New Team Name">
<button onclick="createTeam()">ADD TEAM</button>
</div>
<div id="teamBoard"></div>
</div>
</div>
<div>
<div class="card">
<h2>TOURNAMENT PANEL</h2>
<div id="tournamentPanel"></div>
</div>
<div class="card">
<h2>BUZZ LOG</h2>
<div id="buzzLog" class="log-box muted"></div>
</div>
<div class="card">
<h2>PLAYERS</h2>
<div id="hostPlayers"></div>
</div>
</div>
</div>
</div>

<div id="playerPage" class="hidden">
<div class="grid">
<div class="glass">
<div class="topbar"><button class="back-btn" onclick="goDashboard()">⬅ BACK</button><button class="logout-btn" onclick="logout()">LOGOUT</button></div>
<div class="question" id="question">Waiting for question...</div>
<img id="questionImage" class="question-image" alt="Question image">
<button class="buzzer" id="buzzBtn" onclick="buzz()">BUZZ</button>
<div class="winner" id="reaction"></div>
<div class="winner" id="playerWinner"></div>
<div class="timer" id="playerTimer">10</div>
<div class="winner" id="lockState"></div>
</div>
<div class="glass">
<h2>LIVE SCOREBOARD</h2>
<div id="playerScoreboard"></div>
<div class="card">
<h2>YOUR TEAM</h2>
<select id="teamSelect"></select>
<button onclick="joinSelectedTeam()">SAVE TEAM</button>
</div>
<div class="card">
<h2>TOURNAMENT STATUS</h2>
<div id="playerTournamentPanel"></div>
</div>
</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "YOUR_REAL_API_KEY",
  authDomain: "mahilbuzz-8d984.firebaseapp.com",
  databaseURL: "https://mahilbuzz-8d984-default-rtdb.firebaseio.com",
  projectId: "mahilbuzz-8d984",
  storageBucket: "mahilbuzz-8d984.firebasestorage.app",
  messagingSenderId: "364076231129",
  appId: "1:364076231129:web:538aad1882ce26704d11c8",
  measurementId: "G-JR0172JSE9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.db=db;window.fbRef=ref;window.fbSet=set;window.fbGet=get;window.fbUpdate=update;window.fbOnValue=onValue;window.fbRemove=remove;window.fbRunTransaction=runTransaction;window.fbOnDisconnect=onDisconnect;
window.dispatchEvent(new Event('firebase-ready'));
</script>
<script>
let currentUser=null,currentRoom='',timerInterval=null,roomListenerStartedFor='',presenceRegistered=false;
const buzzSounds={1:'https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3',2:'https://assets.mixkit.co/active_storage/sfx/1018/1018-preview.mp3',3:'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3',4:'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3',5:'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'};

document.getElementById('avatarInput').addEventListener('change',e=>{const file=e.target.files[0];if(file){const reader=new FileReader();reader.onload=ev=>document.getElementById('avatarPreview').src=ev.target.result;reader.readAsDataURL(file)}});
window.addEventListener('load',()=>{const saved=localStorage.getItem('mahilCurrentUser');if(saved){currentUser=JSON.parse(saved);showDashboard()}const params=new URLSearchParams(window.location.search);const roomParam=params.get('room');if(roomParam)document.getElementById('joinCode').value=roomParam.toUpperCase()});
function hideAll(){['loginPage','signupPage','dashboard','joinPage','settingsPage','hostPage','playerPage'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function showSignup(){hideAll();document.getElementById('signupPage').classList.remove('hidden')}
function showLogin(){hideAll();document.getElementById('loginPage').classList.remove('hidden')}
function signup(){const username=signupUsername.value.trim(),email=signupEmail.value.trim(),password=signupPassword.value.trim(),avatar=avatarPreview.src;if(!username||!email||!password)return alert('Fill all fields');let users=JSON.parse(localStorage.getItem('mahilUsers'))||[];if(users.find(u=>u.username===username))return alert('Username Exists');users.push({username,email,password,avatar,sound:'1'});localStorage.setItem('mahilUsers',JSON.stringify(users));alert('Account Created');showLogin()}
function login(){const username=loginUsername.value.trim(),password=loginPassword.value.trim();const users=JSON.parse(localStorage.getItem('mahilUsers'))||[];const user=users.find(u=>u.username===username&&u.password===password);if(!user)return alert('Invalid Login');currentUser=user;localStorage.setItem('mahilCurrentUser',JSON.stringify(currentUser));showDashboard();if(joinCode.value.trim())openJoinPage()}
function showDashboard(){hideAll();dashboard.classList.remove('hidden');profileAvatar.src=currentUser.avatar;profileName.innerText=currentUser.username;profileEmail.innerText=currentUser.email}
function logout(){localStorage.removeItem('mahilCurrentUser');location.reload()}
function goDashboard(){showDashboard()}
function openSettings(){hideAll();settingsPage.classList.remove('hidden');changeName.value=currentUser.username;soundSelect.value=currentUser.sound||'1'}
function saveSettings(){const newName=changeName.value.trim(),sound=soundSelect.value;if(newName)currentUser.username=newName;currentUser.sound=sound;const avatarFile=changeAvatar.files[0];if(avatarFile){const reader=new FileReader();reader.onload=ev=>{currentUser.avatar=ev.target.result;finishSave()};reader.readAsDataURL(avatarFile)}else finishSave()}
function finishSave(){let users=JSON.parse(localStorage.getItem('mahilUsers'))||[];users=users.map(u=>u.email===currentUser.email?currentUser:u);localStorage.setItem('mahilUsers',JSON.stringify(users));localStorage.setItem('mahilCurrentUser',JSON.stringify(currentUser));alert('Saved');location.reload()}
function openJoinPage(){hideAll();joinPage.classList.remove('hidden')}
function waitForFirebase(){return new Promise(resolve=>{if(window.db&&window.fbRef)resolve();else window.addEventListener('firebase-ready',resolve,{once:true})})}
function sanitizeKey(email){return email.replace(/[.#$[\]]/g,'_')}
function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>resolve(e.target.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function generateRoomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];return code}
function getPlayerKey(){return sanitizeKey(currentUser.email)}

async function hostGame(){
  await waitForFirebase();
  try{
    hideAll();
    hostPage.classList.remove('hidden');
    const roomCode=generateRoomCode();
    currentRoom=roomCode;
    await fbSet(fbRef(db,'rooms/'+roomCode),{
      host:currentUser.username,
      hostEmail:currentUser.email,
      roomCode,
      question:'',
      questionImage:'',
      winner:'',
      buzzed:false,
      buzzerLocked:false,
      reaction:'',
      timer:10,
      createdAt:Date.now(),
      mode:'normal',
      scoreMode:'individual',
      buzzLog:{},
      teams:{},
      tournament:{active:false,name:'',currentRound:0,maxRounds:3,history:{}},
      players:{
        [getPlayerKey()]:{
          username:currentUser.username,
          email:currentUser.email,
          avatar:currentUser.avatar,
          sound:currentUser.sound||'1',
          score:0,
          team:'',
          online:true,
          isHost:true
        }
      }
    });
    roomCodeRender(roomCode);
    await registerPresence();
    attachRoomListener();
    alert('Room created: '+roomCode);
  }catch(error){
    console.error(error);
    alert('Failed to create room: '+error.message);
  }
}

function roomCodeRender(roomCode){
  roomCodeEl('ROOM CODE: '+roomCode);
  const joinURL=new URL(window.location.href);
  joinURL.searchParams.set('room',roomCode);
  const qrContainer=document.getElementById('qrcode');
  qrContainer.innerHTML='';
  new QRCode(qrContainer,{text:joinURL.toString(),width:200,height:200,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  joinLinkNote.textContent=joinURL.toString();
}

function roomCodeEl(text){document.getElementById('roomCode').textContent=text}

async function joinGame(){
  await waitForFirebase();
  try{
    const code=joinCode.value.trim().toUpperCase();
    if(!code)return alert('Enter Room Code');
    const snap=await fbGet(fbRef(db,'rooms/'+code));
    if(!snap.exists())return alert('Room Not Found');
    currentRoom=code;
    await fbUpdate(fbRef(db,'rooms/'+code+'/players'),{
      [getPlayerKey()]:{
        username:currentUser.username,
        email:currentUser.email,
        avatar:currentUser.avatar,
        sound:currentUser.sound||'1',
        score:0,
        team:'',
        online:true,
        isHost:false
      }
    });
    await registerPresence();
    hideAll();
    playerPage.classList.remove('hidden');
    attachRoomListener();
    alert('Joined Room '+code);
  }catch(error){
    console.error(error);
    alert('Join failed: '+error.message);
  }
}

async function registerPresence(){
  if(!currentRoom||!currentUser||presenceRegistered)return;
  presenceRegistered=true;
  const pRef=fbRef(db,'rooms/'+currentRoom+'/players/'+getPlayerKey());
  await fbUpdate(pRef,{online:true,lastSeen:Date.now()});
  try{
    const disc=fbOnDisconnect(pRef);
    await disc.update({online:false,lastSeen:Date.now()});
  }catch(e){
    console.warn('Presence setup skipped',e);
  }
}

async function sendQuestion(){
  await waitForFirebase();
  try{
    const q=questionInput.value.trim();
    const file=questionImageInput.files[0];
    if(!currentRoom)return alert('No active room');
    let questionImage='';
    if(file)questionImage=await fileToBase64(file);
    await fbUpdate(fbRef(db,'rooms/'+currentRoom),{
      question:q,
      questionImage,
      winner:'',
      buzzed:false,
      buzzerLocked:false,
      reaction:'',
      timer:10
    });
  }catch(error){
    console.error(error);
    alert('Failed to send question: '+error.message);
  }
}

async function buzz(){
  await waitForFirebase();
  try{
    if(!currentRoom)return;
    const roomRef=fbRef(db,'rooms/'+currentRoom);
    const result=await fbRunTransaction(roomRef,room=>{
      if(room===null)return room;
      if(room.buzzed||room.buzzerLocked)return room;
      room.buzzed=true;
      room.winner=currentUser.username;
      room.reaction=(Math.random()*1.5+0.2).toFixed(3);
      room.buzzLog=room.buzzLog||{};
      room.buzzLog[Date.now()+'_'+getPlayerKey()]={
        user:currentUser.username,
        reaction:room.reaction,
        time:Date.now(),
        round:(room.tournament?.currentRound||0)
      };
      return room;
    });
    if(result.committed){
      const sound=new Audio(buzzSounds[currentUser.sound||'1']);
      sound.play();
      confetti({particleCount:220,spread:140});
    }
  }catch(error){
    console.error(error);
  }
}

async function lockBuzzers(){await fbUpdate(fbRef(db,'rooms/'+currentRoom),{buzzerLocked:true})}
async function unlockBuzzers(){await fbUpdate(fbRef(db,'rooms/'+currentRoom),{buzzerLocked:false,buzzed:false,winner:'',reaction:''})}
async function resetBuzzers(){await fbUpdate(fbRef(db,'rooms/'+currentRoom),{buzzed:false,winner:'',reaction:'',timer:10,buzzerLocked:false})}

async function startTimer(){
  await waitForFirebase();
  try{
    if(!currentRoom)return;
    clearInterval(timerInterval);
    let time=10;
    await fbUpdate(fbRef(db,'rooms/'+currentRoom),{timer:time});
    timerInterval=setInterval(async()=>{
      time--;
      await fbUpdate(fbRef(db,'rooms/'+currentRoom),{timer:time});
      if(time<=0)clearInterval(timerInterval);
    },1000);
  }catch(error){
    console.error(error);
  }
}

async function addPoints(){await changeWinnerScore(10,false)}
async function minusPoints(){await changeWinnerScore(-10,false)}
async function addTeamPoints(){await changeWinnerScore(10,true)}
async function minusTeamPoints(){await changeWinnerScore(-10,true)}

async function changeWinnerScore(delta,teamMode){
  await waitForFirebase();
  try{
    if(!currentRoom)return;
    const snap=await fbGet(fbRef(db,'rooms/'+currentRoom));
    if(!snap.exists())return;
    const room=snap.val(),players=room.players||{},winnerName=room.winner;
    let winnerKey=null;
    for(const key in players){
      if(players[key].username===winnerName){winnerKey=key;break}
    }
    if(!winnerKey)return;
    if(teamMode){
      const team=players[winnerKey].team;
      if(!team)return alert('Winner has no team');
      const teamKey=sanitizeKey(team);
      const cur=((room.teams||{})[teamKey]?.score)||0;
      await fbUpdate(fbRef(db,'rooms/'+currentRoom+'/teams/'+teamKey),{name:team,score:cur+delta});
    }else{
      const currentScore=players[winnerKey].score||0;
      await fbUpdate(fbRef(db,'rooms/'+currentRoom+'/players/'+winnerKey),{score:currentScore+delta});
    }
  }catch(error){
    console.error(error);
  }
}

async function setGameMode(mode){await fbUpdate(fbRef(db,'rooms/'+currentRoom),{mode})}
async function setScoreMode(scoreMode){await fbUpdate(fbRef(db,'rooms/'+currentRoom),{scoreMode})}

async function startTournament(){
  const name=tournamentName.value.trim()||'Quiz Tournament';
  const max=parseInt(maxRounds.value||'3',10);
  await fbUpdate(fbRef(db,'rooms/'+currentRoom+'/tournament'),{active:true,name,currentRound:1,maxRounds:max,history:{}});
  await fbUpdate(fbRef(db,'rooms/'+currentRoom),{mode:'tournament'});
}

async function advanceTournamentRound(){
  const snap=await fbGet(fbRef(db,'rooms/'+currentRoom));
  if(!snap.exists())return;
  const room=snap.val();
  const t=room.tournament||{};
  const round=t.currentRound||1;
  const history=t.history||{};
  history['round_'+round]={winner:room.winner||'',time:Date.now(),question:room.question||''};
  const nextRound=round+1;
  const finished=nextRound>(t.maxRounds||3);
  await fbUpdate(fbRef(db,'rooms/'+currentRoom+'/tournament'),{
    history,
    currentRound:finished?round:nextRound,
    active:!finished,
    champion:finished?(room.winner||''):(t.champion||'')
  });
  if(finished){
    await fbUpdate(fbRef(db,'rooms/'+currentRoom),{question:'Tournament Finished',buzzerLocked:true});
  }else{
    await fbUpdate(fbRef(db,'rooms/'+currentRoom),{winner:'',buzzed:false,reaction:'',buzzerLocked:false,question:'Round '+nextRound});
  }
}

async function createTeam(){
  const name=teamNameInput.value.trim();
  if(!name)return;
  const key=sanitizeKey(name);
  await fbUpdate(fbRef(db,'rooms/'+currentRoom+'/teams/'+key),{name,score:0});
  teamNameInput.value='';
}

async function joinSelectedTeam(){
  const team=teamSelect.value;
  if(!team)return alert('Choose a team');
  await fbUpdate(fbRef(db,'rooms/'+currentRoom+'/players/'+getPlayerKey()),{team});
}

async function kickPlayer(email){
  const key=sanitizeKey(email);
  if(key===getPlayerKey())return alert('Host cannot kick self here');
  await fbRemove(fbRef(db,'rooms/'+currentRoom+'/players/'+key));
}

async function clearRooms(){
  await waitForFirebase();
  try{
    await fbRemove(fbRef(db,'rooms'));
    alert('All rooms cleared');
  }catch(error){
    console.error(error);
    alert('Failed to clear rooms: '+error.message);
  }
}

function attachRoomListener(){
  if(!currentRoom||roomListenerStartedFor===currentRoom)return;
  roomListenerStartedFor=currentRoom;
  fbOnValue(fbRef(db,'rooms/'+currentRoom),snapshot=>{
    const room=snapshot.val();
    if(!room)return;

    roomCodeEl('ROOM CODE: '+(room.roomCode||currentRoom));
    document.getElementById('question').innerText=room.question||'Waiting for question...';
    modeBadge.textContent=(room.mode||'normal').toUpperCase()+' MODE';

    const img=document.getElementById('questionImage');
    if(room.questionImage){
      img.src=room.questionImage;
      img.style.display='block';
    }else{
      img.style.display='none';
    }

    renderPlayers(room);
    renderTeams(room);
    renderBuzzLog(room);
    renderTournament(room);
    updateBoards(room);

    if(room.winner){
      playerWinner.innerHTML='⚡ '+room.winner+' BUZZED FIRST';
      winner.innerHTML='⚡ '+room.winner+' BUZZED FIRST';
      buzzBtn.disabled=true;
      buzzBtn.classList.add('locked');
      if(room.reaction)reaction.innerHTML='Reaction Time: '+room.reaction+'s';
    }else{
      playerWinner.innerHTML='';
      winner.innerHTML='';
      reaction.innerHTML='';
      buzzBtn.disabled=!!room.buzzerLocked;
      buzzBtn.classList.toggle('locked',!!room.buzzerLocked);
    }

    lockState.innerHTML=room.buzzerLocked?'🔒 Host locked buzzer':'🟢 Buzzer open';
    timer.innerHTML=room.timer??10;
    playerTimer.innerHTML=room.timer??10;
    fillTeamSelect(room);
  });
}

function updateBoards(room){
  const players=Object.values(room.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));
  let html='';
  players.forEach(player=>{
    html+=`<div class="player"><div class="player-left"><img src="${player.avatar}" alt="${player.username}"><div><b>${player.username}</b><br><small>${player.email}</small><br><span class="muted">${player.team||'No Team'} • ${player.online?'Online':'Offline'}</span></div></div><div style="font-size:1.2rem">${player.score||0} pts</div></div>`;
  });
  hostScoreboard.innerHTML=html;
  playerScoreboard.innerHTML=html;
}

function renderTeams(room){
  const teams=Object.values(room.teams||{}).sort((a,b)=>(b.score||0)-(a.score||0));
  let html='';
  if(!teams.length)html='<div class="muted">No teams yet</div>';
  teams.forEach(t=>{
    html+=`<div class="player"><div><b>${t.name}</b></div><div>${t.score||0} pts</div></div>`;
  });
  teamBoard.innerHTML=html;
}

function renderPlayers(room){
  const players=Object.values(room.players||{});
  let html='';
  players.forEach(p=>{
    html+=`<div class="player"><div class="player-left"><img src="${p.avatar}" alt="${p.username}"><div><b>${p.username}</b><br><span class="muted">${p.team||'No Team'} • ${p.online?'Online':'Offline'}</span></div></div><button class="kick-btn" onclick="kickPlayer('${p.email}')">KICK</button></div>`;
  });
  hostPlayers.innerHTML=html;
}

function renderBuzzLog(room){
  const logs=Object.values(room.buzzLog||{}).sort((a,b)=>(b.time||0)-(a.time||0));
  let html='';
  if(!logs.length)html='<div class="muted">No buzzes yet</div>';
  logs.forEach(log=>{
    html+=`<div class="player"><div><b>${log.user}</b><br><span class="muted">Round ${log.round||0}</span></div><div>${log.reaction}s</div></div>`;
  });
  buzzLog.innerHTML=html;
}

function renderTournament(room){
  const t=room.tournament||{};
  let html=`<div class="muted">${t.active?'Tournament Running':'Tournament Idle'}</div>`;
  html+=`<table class="table"><tr><th>Name</th><td>${t.name||'-'}</td></tr><tr><th>Round</th><td>${t.currentRound||0}/${t.maxRounds||0}</td></tr><tr><th>Champion</th><td>${t.champion||'-'}</td></tr></table>`;
  const history=t.history||{};
  const rows=Object.keys(history).sort().map(k=>`<tr><td>${k.replace('_',' ')}</td><td>${history[k].winner||'-'}</td><td>${history[k].question||'-'}</td></tr>`).join('');
  html+=`<table class="table"><tr><th>Round</th><th>Winner</th><th>Question</th></tr>${rows||'<tr><td colspan="3">No rounds yet</td></tr>'}</table>`;
  tournamentPanel.innerHTML=html;
  playerTournamentPanel.innerHTML=html;
}

function fillTeamSelect(room){
  const teams=Object.values(room.teams||{});
  let options='<option value="">Choose team</option>';
  teams.forEach(t=>options+=`<option value="${t.name}">${t.name}</option>`);
  teamSelect.innerHTML=options;
}

document.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    const btn=document.getElementById('buzzBtn');
    if(btn&&!btn.disabled)buzz();
  }
});
</script>
