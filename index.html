<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAHIL QUIZ ARENA</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Orbitron',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.container{
width:95%;
max-width:1400px;
margin:auto;
padding:20px;
}

.hidden{
display:none!important;
}

.title{
text-align:center;
font-size:3.2rem;
font-weight:900;
margin:20px 0;
color:#00e5ff;
text-shadow:0 0 25px #00e5ff;
}

.glass{
background:rgba(255,255,255,0.07);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.08);
border-radius:25px;
padding:25px;
margin-top:20px;
box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.profile{
display:flex;
align-items:center;
gap:15px;
}

.profile img{
width:65px;
height:65px;
border-radius:50%;
object-fit:cover;
border:3px solid #00e5ff;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.dashboard-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}

.big-btn{
height:140px;
font-size:1.5rem;
font-weight:900;
}

input,
button,
textarea,
select{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:16px;
font-size:1rem;
font-family:'Orbitron',sans-serif;
}

input,
textarea,
select{
background:#111827;
color:white;
}

button{
background:linear-gradient(135deg,#00e5ff,#ff00d4);
color:white;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.logout-btn{
width:auto;
padding:12px 20px;
background:red;
}

.back-btn{
width:auto;
padding:12px 20px;
background:#2563eb;
}

.avatar-preview{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #00e5ff;
display:block;
margin:auto;
}

.question{
font-size:2rem;
text-align:center;
color:#00e5ff;
margin-top:20px;
}

.buzzer{
width:260px;
height:260px;
border-radius:50%;
margin:30px auto;
display:block;
border:none;
font-size:3rem;
font-weight:900;
background:radial-gradient(circle,#ffe600,#ff9800);
color:black;
box-shadow:0 0 50px #ffe600;
}

.locked{
background:#555!important;
box-shadow:none!important;
}

.room-code{
text-align:center;
font-size:2rem;
color:#00e5ff;
margin-top:15px;
}

.player{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:rgba(255,255,255,0.06);
border-radius:18px;
margin-top:10px;
}

.player-left{
display:flex;
align-items:center;
gap:12px;
}

.player-left img{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.timer{
font-size:2rem;
text-align:center;
color:#ffe600;
margin-top:15px;
}

.winner{
font-size:1.5rem;
text-align:center;
color:#00ff99;
margin-top:15px;
}

.delete-btn{
background:red;
width:auto;
padding:10px 15px;
}

.role-btn{
background:#22c55e;
width:auto;
padding:10px 15px;
}

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.dashboard-buttons{
grid-template-columns:1fr;
}

.title{
font-size:2.2rem;
}

.buzzer{
width:210px;
height:210px;
font-size:2rem;
}

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">MAHIL QUIZ ARENA</h1>

<!-- LOGIN -->

<div id="loginPage" class="glass">

<h2>LOGIN</h2>

<input type="text"
id="loginUsername"
placeholder="Username">

<input type="password"
id="loginPassword"
placeholder="Password">

<button onclick="login()">
LOGIN
</button>

<button onclick="showSignup()">
SIGN UP
</button>

</div>

<!-- SIGNUP -->

<div id="signupPage"
class="glass hidden">

<div class="topbar">

<button class="back-btn"
onclick="showLogin()">
⬅ BACK
</button>

</div>

<h2>CREATE ACCOUNT</h2>

<input type="text"
id="signupUsername"
placeholder="Username">

<input type="email"
id="signupEmail"
placeholder="Email">

<input type="password"
id="signupPassword"
placeholder="Password">

<img id="avatarPreview"
class="avatar-preview"
src="https://i.pravatar.cc/150?img=12">

<input type="file"
id="avatarInput"
accept="image/*">

<button onclick="signup()">
CREATE ACCOUNT
</button>

</div>

<!-- DASHBOARD -->

<div id="dashboard"
class="hidden glass">

<div class="topbar">

<div class="profile">

<img id="profileAvatar">

<div>

<h2 id="profileName"></h2>

<p id="profileEmail"></p>

</div>

</div>

<button class="logout-btn"
onclick="logout()">
LOGOUT
</button>

</div>

<h2 style="text-align:center">
WELCOME TO MAHIL QUIZ ARENA
</h2>

<div class="dashboard-buttons">

<button class="big-btn"
onclick="hostGame()">
HOST GAME
</button>

<button class="big-btn"
onclick="openJoinPage()">
PLAY GAME
</button>

<button class="big-btn"
onclick="openSettings()">
SETTINGS
</button>

<button class="big-btn"
onclick="openAdminPanel()"
id="adminBtn">
ROLE MANAGEMENT
</button>

</div>

</div>

<!-- JOIN PAGE -->

<div id="joinPage"
class="hidden glass">

<div class="topbar">

<button class="back-btn"
onclick="goDashboard()">
⬅ BACK
</button>

<h2>JOIN GAME</h2>

</div>

<input type="text"
id="joinCode"
placeholder="Enter Room Code">

<button onclick="joinGame()">
JOIN ROOM
</button>

</div>

<!-- SETTINGS -->

<div id="settingsPage"
class="hidden glass">

<div class="topbar">

<button class="back-btn"
onclick="goDashboard()">
⬅ BACK
</button>

<h2>SETTINGS</h2>

</div>

<input type="text"
id="changeName"
placeholder="Change Username">

<input type="file"
id="changeAvatar"
accept="image/*">

<select id="soundSelect">

<option value="1">Classic Buzz</option>
<option value="2">Electric Buzz</option>
<option value="3">Game Show</option>
<option value="4">Laser Buzz</option>
<option value="5">Cyber Buzz</option>

</select>

<button onclick="saveSettings()">
SAVE SETTINGS
</button>

</div>

<!-- ADMIN -->

<div id="adminPage"
class="hidden glass">

<div class="topbar">

<button class="back-btn"
onclick="goDashboard()">
⬅ BACK
</button>

<h2>ROLE MANAGEMENT</h2>

</div>

<div id="allUsers"></div>

<h2 style="margin-top:30px">
ADD NEW USER
</h2>

<input type="text"
id="adminNewUser"
placeholder="Username">

<input type="email"
id="adminNewMail"
placeholder="Email">

<input type="password"
id="adminNewPass"
placeholder="Password">

<button onclick="adminAddUser()">
ADD USER
</button>

</div>

<!-- HOST -->

<div id="hostPage"
class="hidden glass">

<div class="topbar">

<button class="back-btn"
onclick="goDashboard()">
⬅ BACK
</button>

<h2>HOST PANEL</h2>

<button class="logout-btn"
onclick="logout()">
LOGOUT
</button>

</div>

<div class="room-code"
id="roomCode"></div>

<textarea id="questionInput"
placeholder="Enter Question"></textarea>

<button onclick="sendQuestion()">
SEND QUESTION
</button>

<button onclick="resetBuzzers()">
RESET BUZZERS
</button>

<button onclick="startTimer()">
START TIMER
</button>

<button onclick="addPoints()">
+10 POINTS
</button>

<div class="timer"
id="timer">
10
</div>

<div class="winner"
id="winner"></div>

<h2 style="margin-top:20px">
LIVE SCOREBOARD
</h2>

<div id="hostScoreboard"></div>

</div>

<!-- PLAYER -->

<div id="playerPage"
class="hidden">

<div class="grid">

<div class="glass">

<div class="topbar">

<button class="back-btn"
onclick="goDashboard()">
⬅ BACK
</button>

<button class="logout-btn"
onclick="logout()">
LOGOUT
</button>

</div>

<div class="question"
id="question">
Waiting for question...
</div>

<button class="buzzer"
id="buzzBtn"
onclick="buzz()">
BUZZ
</button>

<div class="winner"
id="reaction"></div>

<div class="winner"
id="playerWinner"></div>

<div class="timer"
id="playerTimer">
10
</div>

</div>

<div class="glass">

<h2>LIVE SCOREBOARD</h2>

<div id="playerScoreboard"></div>

</div>

</div>

</div>

</div>

<script>

let currentUser=null;
let gameRoom='';
let currentRoom='';
let timerInterval=null;

const gameRooms={};

const buzzSounds={
1:'https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3',
2:'https://assets.mixkit.co/active_storage/sfx/1018/1018-preview.mp3',
3:'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3',
4:'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3',
5:'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'
};

document.getElementById('avatarInput')
.addEventListener('change',e=>{

const file=e.target.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(event){

document.getElementById('avatarPreview')
.src=event.target.result;

};

reader.readAsDataURL(file);

}

});

window.onload=function(){

const saved=
localStorage.getItem('mahilCurrentUser');

if(saved){

currentUser=
JSON.parse(saved);

showDashboard();

}

};

function hideAll(){

document.getElementById('loginPage').classList.add('hidden');
document.getElementById('signupPage').classList.add('hidden');
document.getElementById('dashboard').classList.add('hidden');
document.getElementById('joinPage').classList.add('hidden');
document.getElementById('settingsPage').classList.add('hidden');
document.getElementById('adminPage').classList.add('hidden');
document.getElementById('hostPage').classList.add('hidden');
document.getElementById('playerPage').classList.add('hidden');

}

function showSignup(){

hideAll();

document.getElementById('signupPage')
.classList.remove('hidden');

}

function showLogin(){

hideAll();

document.getElementById('loginPage')
.classList.remove('hidden');

}

function signup(){

const username=
document.getElementById('signupUsername').value.trim();

const email=
document.getElementById('signupEmail').value.trim();

const password=
document.getElementById('signupPassword').value.trim();

const avatar=
document.getElementById('avatarPreview').src;

if(!username || !email || !password){

alert('Fill all fields');

return;

}

let users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

if(users.find(u=>u.username===username)){

alert('Username Exists');

return;

}

const user={

username,
email,
password,
avatar,
score:0,
sound:'1',
role:
username.toLowerCase()==='admin'
? 'admin'
: 'player'

};

users.push(user);

localStorage.setItem(
'mahilUsers',
JSON.stringify(users)
);

alert('Account Created');

showLogin();

}

function login(){

const username=
document.getElementById('loginUsername').value.trim();

const password=
document.getElementById('loginPassword').value.trim();

const users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

const user=
users.find(
u=>
u.username===username &&
u.password===password
);

if(!user){

alert('Invalid Login');

return;

}

currentUser=user;

localStorage.setItem(
'mahilCurrentUser',
JSON.stringify(currentUser)
);

showDashboard();

}

function showDashboard(){

hideAll();

document.getElementById('dashboard')
.classList.remove('hidden');

document.getElementById('profileAvatar')
.src=currentUser.avatar;

document.getElementById('profileName')
.innerText=currentUser.username;

document.getElementById('profileEmail')
.innerText=currentUser.email;

if(currentUser.role==='admin'){

document.getElementById('adminBtn')
.style.display='block';

}else{

document.getElementById('adminBtn')
.style.display='none';

}

}

function goDashboard(){

showDashboard();

}

function logout(){

localStorage.removeItem(
'mahilCurrentUser'
);

location.reload();

}

function openSettings(){

hideAll();

document.getElementById('settingsPage')
.classList.remove('hidden');

document.getElementById('changeName')
.value=currentUser.username;

document.getElementById('soundSelect')
.value=currentUser.sound;

}

function saveSettings(){

const newName=
document.getElementById('changeName').value.trim();

const sound=
document.getElementById('soundSelect').value;

const avatarFile=
document.getElementById('changeAvatar').files[0];

if(newName){

currentUser.username=newName;

}

currentUser.sound=sound;

if(avatarFile){

const reader=new FileReader();

reader.onload=function(event){

currentUser.avatar=
event.target.result;

finishSave();

};

reader.readAsDataURL(avatarFile);

}else{

finishSave();

}

}

function finishSave(){

let users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

users=
users.map(u=>
u.email===currentUser.email
? currentUser
: u
);

localStorage.setItem(
'mahilUsers',
JSON.stringify(users)
);

localStorage.setItem(
'mahilCurrentUser',
JSON.stringify(currentUser)
);

alert('Settings Saved');

location.reload();

}

function openAdminPanel(){

if(currentUser.role!=='admin'){

alert('Admin Only');

return;

}

hideAll();

document.getElementById('adminPage')
.classList.remove('hidden');

loadUsers();

}

function loadUsers(){

const users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

let html='';

users.forEach((user,index)=>{

html+=`

<div class="player">

<div class="player-left">

<img src="${user.avatar}">

<div>

<b>${user.username}</b><br>

<small>${user.email}</small><br>

Role: ${user.role}

</div>

</div>

<div>

<button class="role-btn"
onclick="toggleRole(${index})">
CHANGE ROLE
</button>

<button class="delete-btn"
onclick="deleteUser(${index})">
REMOVE
</button>

</div>

</div>

`;

});

document.getElementById('allUsers')
.innerHTML=html;

}

function toggleRole(index){

let users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

users[index].role=
users[index].role==='admin'
? 'player'
: 'admin';

localStorage.setItem(
'mahilUsers',
JSON.stringify(users)
);

loadUsers();

}

function deleteUser(index){

let users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

users.splice(index,1);

localStorage.setItem(
'mahilUsers',
JSON.stringify(users)
);

loadUsers();

}

function adminAddUser(){

const username=
document.getElementById('adminNewUser').value.trim();

const email=
document.getElementById('adminNewMail').value.trim();

const password=
document.getElementById('adminNewPass').value.trim();

if(!username || !email || !password){

alert('Fill all fields');

return;

}

let users=
JSON.parse(localStorage.getItem('mahilUsers'))
|| [];

users.push({

username,
email,
password,
avatar:'https://i.pravatar.cc/150?img=20',
score:0,
sound:'1',
role:'player'

});

localStorage.setItem(
'mahilUsers',
JSON.stringify(users)
);

alert('User Added');

loadUsers();

}

function openJoinPage(){

hideAll();

document.getElementById('joinPage')
.classList.remove('hidden');

}

function hostGame(){

hideAll();

document.getElementById('hostPage')
.classList.remove('hidden');

gameRoom=
Math.floor(
100000+Math.random()*900000
).toString();

currentRoom=gameRoom;

gameRooms[gameRoom]={

host:currentUser.username,
question:'',
buzzed:false,
winner:'',
players:[]

};

document.getElementById('roomCode')
.innerHTML=
'ROOM CODE: '+gameRoom;

addPlayerToRoom();

updateBoards();

}

function joinGame(){

const code=
document.getElementById('joinCode')
.value.trim();

if(!gameRooms[code]){

alert('Room Not Found');

return;

}

currentRoom=code;

hideAll();

document.getElementById('playerPage')
.classList.remove('hidden');

addPlayerToRoom();

updateBoards();

alert('Joined Room '+code);

}

function addPlayerToRoom(){

const room=
gameRooms[currentRoom];

if(!room.players.find(
p=>p.email===currentUser.email
)){

room.players.push({
...currentUser
});

}

}

function sendQuestion(){

const q=
document.getElementById('questionInput')
.value.trim();

if(!q) return;

const room=
gameRooms[currentRoom];

room.question=q;

room.buzzed=false;

room.winner='';

document.getElementById('question')
.innerText=q;

document.getElementById('buzzBtn')
.disabled=false;

document.getElementById('buzzBtn')
.classList.remove('locked');

document.getElementById('winner')
.innerHTML='';

document.getElementById('reaction')
.innerHTML='';

document.getElementById('playerWinner')
.innerHTML='';

}

function buzz(){

const room=
gameRooms[currentRoom];

if(room.buzzed) return;

room.buzzed=true;

room.winner=currentUser.username;

const reaction=
(Math.random()*1.5+0.2)
.toFixed(3);

document.getElementById('reaction')
.innerHTML=
'Reaction Time: '+reaction+'s';

document.getElementById('playerWinner')
.innerHTML=
'⚡ '+currentUser.username+
' BUZZED FIRST';

document.getElementById('winner')
.innerHTML=
'⚡ '+currentUser.username+
' BUZZED FIRST';

document.getElementById('buzzBtn')
.disabled=true;

document.getElementById('buzzBtn')
.classList.add('locked');

const sound=
new Audio(
buzzSounds[currentUser.sound]
);

sound.play();

confetti({
particleCount:220,
spread:140
});

gsap.fromTo(
'.buzzer',
{scale:1},
{
scale:1.15,
duration:0.2,
repeat:1,
yoyo:true
}
);

}

function resetBuzzers(){

const room=
gameRooms[currentRoom];

room.buzzed=false;

room.winner='';

document.getElementById('buzzBtn')
.disabled=false;

document.getElementById('buzzBtn')
.classList.remove('locked');

document.getElementById('winner')
.innerHTML='';

document.getElementById('reaction')
.innerHTML='';

document.getElementById('playerWinner')
.innerHTML='';

}

function addPoints(){

const room=
gameRooms[currentRoom];

const player=
room.players.find(
p=>p.username===room.winner
);

if(player){

player.score+=10;

updateBoards();

}

}

function updateBoards(){

const room=
gameRooms[currentRoom];

if(!room) return;

let html='';

room.players
.sort((a,b)=>b.score-a.score)
.forEach(player=>{

html+=`

<div class="player">

<div class="player-left">

<img src="${player.avatar}">

<div>

<b>${player.username}</b><br>

<small>${player.email}</small>

</div>

</div>

<div>
${player.score} pts
</div>

</div>

`;

});

if(document.getElementById('hostScoreboard')){

document.getElementById('hostScoreboard')
.innerHTML=html;

}

if(document.getElementById('playerScoreboard')){

document.getElementById('playerScoreboard')
.innerHTML=html;

}

}

function startTimer(){

clearInterval(timerInterval);

let time=10;

document.getElementById('timer')
.innerHTML=time;

document.getElementById('playerTimer')
.innerHTML=time;

timerInterval=setInterval(()=>{

time--;

document.getElementById('timer')
.innerHTML=time;

document.getElementById('playerTimer')
.innerHTML=time;

if(time<=0){

clearInterval(timerInterval);

}

},1000);

}

document.addEventListener('keydown',e=>{

if(e.code==='Space'){

e.preventDefault();

const btn=
document.getElementById('buzzBtn');

if(btn && !btn.disabled){

buzz();

}

}

});

</script>

</body>
</html>
