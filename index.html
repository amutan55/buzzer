<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahil Buzzer Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #0b0f19;
  --surface: rgba(255, 255, 255, 0.04);
  --border: rgba(255, 255, 255, 0.1);
  --primary: #00f2fe;
  --secondary: #4facfe;
  --accent: #ff007f;
  --gold: #ffd700;
  --success: #10b981;
  --danger: #ef4444;
  --text: #f8fafc;
  --muted: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 12px;
}

.container { width: 100%; max-width: 900px; }
h1, h2, h3, .brand, .buzzer, .btn-orbitron { font-family: 'Orbitron', sans-serif; }
.hidden { display: none !important; }

.glass {
  background: var(--surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  margin-top: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
}

.brand {
  text-align: center;
  font-size: 2.2rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.sub-brand {
  text-align: center;
  color: var(--muted);
  font-size: 0.95rem;
  margin-bottom: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

input, select {
  width: 100%;
  padding: 14px 16px;
  margin-top: 10px;
  border-radius: 12px;
  background: #151d30;
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--primary); }

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  color: #040914;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  font-size: 1rem;
}
button:hover { opacity: 0.92; transform: translateY(-1px); }
button:active { transform: translateY(1px); }

.btn-secondary { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; }
.btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
.btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

/* Buzzer button */
.buzzer-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 30px 0;
}
.buzzer {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffd000, #ff5100);
  color: #000;
  font-size: 2.2rem;
  font-weight: 900;
  border: 6px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 45px rgba(255, 115, 0, 0.6), inset 0 6px 12px rgba(255, 255, 255, 0.6), inset 0 -6px 12px rgba(0, 0, 0, 0.4);
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  transition: transform 0.08s, filter 0.2s, box-shadow 0.2s;
}
.buzzer:active:not(:disabled) {
  transform: scale(0.94);
  box-shadow: 0 0 20px rgba(255, 115, 0, 0.4);
}
.buzzer.locked {
  background: #334155 !important;
  color: #64748b !important;
  box-shadow: none !important;
  border-color: #1e293b !important;
  cursor: not-allowed;
  transform: none !important;
}

.status-pill {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.08);
}
.status-pill.open { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }
.status-pill.locked { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }

.winner-banner {
  text-align: center;
  padding: 16px;
  border-radius: 14px;
  background: rgba(0, 242, 254, 0.08);
  border: 1px solid rgba(0, 242, 254, 0.3);
  margin-top: 14px;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--primary);
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.buzz-queue {
  max-height: 260px;
  overflow-y: auto;
  margin-top: 12px;
}
.queue-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-top: 6px;
}
.queue-item:first-child {
  border-color: var(--gold);
  background: rgba(255, 215, 0, 0.08);
}

.scoreboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.score-card {
  padding: 12px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  text-align: center;
}
.score-card b { display: block; font-size: 1.1rem; }
.score-card .pts { font-size: 1.4rem; color: var(--primary); font-weight: 800; font-family: 'Orbitron', sans-serif; }

.qr-box {
  background: #fff;
  padding: 12px;
  border-radius: 14px;
  width: 170px;
  height: 170px;
  margin: 12px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

@media (max-width: 600px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .buzzer { width: 180px; height: 180px; font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="container">
  <h1 class="brand">MAHIL BUZZER</h1>
  <p class="sub-brand">Fast Solo & Team Quizzing Arena</p>

  <!-- LOBBY SCREEN -->
  <div id="lobbyPage" class="glass">
    <h2>JOIN OR CREATE ARENA</h2>
    <input type="text" id="usernameInput" placeholder="Your Display Name" maxlength="20">
    
    <div style="margin-top: 16px;">
      <label style="font-size:0.9rem; color:var(--muted)">Mode Selection</label>
      <select id="gameModeSelect">
        <option value="solo">Solo Buzzer (Individual)</option>
        <option value="team">Team Buzzer</option>
      </select>
    </div>

    <div id="teamField" class="hidden">
      <input type="text" id="teamInput" placeholder="Team Name (e.g. Red Dragons, Alpha)" maxlength="20">
    </div>

    <div class="grid-2" style="margin-top: 12px;">
      <button class="btn-success btn-orbitron" onclick="hostRoom()">HOST ARENA</button>
      <button class="btn-orbitron" onclick="showJoinBox()">JOIN ARENA</button>
    </div>

    <div id="joinBox" class="hidden" style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px;">
      <input type="text" id="roomCodeInput" placeholder="6-Letter Room Code" style="text-transform:uppercase;">
      <button onclick="joinRoom()">CONNECT TO ROOM</button>
    </div>
  </div>

  <!-- HOST CONTROLS SCREEN -->
  <div id="hostPage" class="glass hidden">
    <div class="topbar">
      <div>
        <span class="status-pill" id="hostRoomCodeLabel">ROOM: -</span>
        <span class="status-pill" id="hostModeLabel">SOLO</span>
      </div>
      <button class="btn-secondary" style="width:auto; padding:8px 14px; margin:0;" onclick="leaveRoom()">EXIT</button>
    </div>

    <div class="qr-box"><div id="qrcode"></div></div>
    
    <div class="winner-banner" id="hostWinnerBanner">Waiting for buzzes...</div>

    <div class="grid-3" style="margin-top:14px;">
      <button class="btn-warning btn-orbitron" onclick="unlockBuzzers()">⚡ UNLOCK (CLEAR)</button>
      <button class="btn-danger btn-orbitron" onclick="lockBuzzers()">🔒 LOCK</button>
      <button class="btn-orbitron" onclick="awardPoints(10)">+10 PTS</button>
    </div>
    
    <div class="grid-3" style="margin-top:4px;">
      <button class="btn-secondary" onclick="awardPoints(-5)">-5 PTS</button>
      <button class="btn-secondary" onclick="resetAllScores()">RESET SCORES</button>
      <button class="btn-secondary" onclick="copyJoinLink()">COPY LINK</button>
    </div>

    <h3 style="margin-top: 20px; font-size:1rem; color:var(--muted);">BUZZ QUEUE (FIRST TO LAST)</h3>
    <div id="hostBuzzQueue" class="buzz-queue"></div>

    <h3 style="margin-top: 20px; font-size:1rem; color:var(--muted);">SCOREBOARD</h3>
    <div id="hostScoreboard" class="scoreboard-grid"></div>
  </div>

  <!-- PLAYER SCREEN -->
  <div id="playerPage" class="glass hidden">
    <div class="topbar">
      <div>
        <span class="status-pill" id="playerRoomCodeLabel">ROOM: -</span>
        <span class="status-pill" id="playerStatusPill">STATUS</span>
      </div>
      <button class="btn-secondary" style="width:auto; padding:8px 14px; margin:0;" onclick="leaveRoom()">LEAVE</button>
    </div>

    <div class="winner-banner" id="playerWinnerBanner">Ready for next question</div>

    <div class="buzzer-wrap">
      <button class="buzzer locked" id="buzzerBtn" onclick="triggerBuzz()">BUZZ</button>
      <p style="margin-top:12px; font-size:0.85rem; color:var(--muted);">Press SPACEBAR or click to buzz</p>
    </div>

    <h3 style="margin-top: 10px; font-size:1rem; color:var(--muted);">LIVE STANDINGS</h3>
    <div id="playerScoreboard" class="scoreboard-grid"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_REAL_API_KEY",
  authDomain: "mahilbuzz-8d984.firebaseapp.com",
  databaseURL: "https://mahilbuzz-8d984-default-rtdb.firebaseio.com",
  projectId: "mahilbuzz-8d984",
  storageBucket: "mahilbuzz-8d984.firebasestorage.app",
  messagingSenderId: "364076231129",
  appId: "1:364076231129:web:538aad1882ce26704d11c8"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.fbRef = ref;
window.fbSet = set;
window.fbGet = get;
window.fbUpdate = update;
window.fbOnValue = onValue;
window.fbRemove = remove;
window.fbRunTransaction = runTransaction;
</script>

<script>
let currentRoom = null;
let isHost = false;
let userProfile = { name: '', team: '', mode: 'solo' };
let audioCtx = null;
let roomUnsubscribe = null;

// Clean Web Audio Synthesizer for high-performance buzzer
function playBuzzerSound(type = 'buzz') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'buzz') {
      // Classic game-show buzzer sound (sawtooth with pitch drop)
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.35);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'unlock') {
      // Short high chime for unlocking
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.25);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }
  } catch (e) {
    console.warn('Audio Context unlock required by user gesture', e);
  }
}

// UI State Management
document.getElementById('gameModeSelect').addEventListener('change', (e) => {
  document.getElementById('teamField').classList.toggle('hidden', e.target.value !== 'team');
});

function showJoinBox() {
  document.getElementById('joinBox').classList.remove('hidden');
}

function sanitize(str) {
  return String(str || '').replace(/[.#$[\]]/g, '_').trim();
}

function getUserId() {
  let id = localStorage.getItem('mahil_uid');
  if (!id) {
    id = 'user_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('mahil_uid', id);
  }
  return id;
}

function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// Hosting
async function hostRoom() {
  const name = document.getElementById('usernameInput').value.trim() || 'Host';
  const mode = document.getElementById('gameModeSelect').value;
  const roomCode = generateRoomCode();

  userProfile = { name, team: '', mode };
  isHost = true;
  currentRoom = roomCode;

  const roomData = {
    host: name,
    mode: mode,
    locked: true,
    firstBuzzer: null,
    buzzQueue: {},
    scores: {},
    createdAt: Date.now()
  };

  await window.fbSet(window.fbRef(window.db, `buzz_rooms/${roomCode}`), roomData);
  initHostUI(roomCode, mode);
  listenToRoom(roomCode);
}

function initHostUI(roomCode, mode) {
  document.getElementById('lobbyPage').classList.add('hidden');
  document.getElementById('playerPage').classList.add('hidden');
  document.getElementById('hostPage').classList.remove('hidden');

  document.getElementById('hostRoomCodeLabel').textContent = `ROOM: ${roomCode}`;
  document.getElementById('hostModeLabel').textContent = mode.toUpperCase();

  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  const joinURL = new URL(window.location.href);
  joinURL.searchParams.set('room', roomCode);

  new QRCode(qrContainer, {
    text: joinURL.toString(),
    width: 146,
    height: 146,
    colorDark: '#000000',
    colorLight: '#ffffff'
  });
}

// Joining
async function joinRoom() {
  const name = document.getElementById('usernameInput').value.trim();
  const roomCode = (document.getElementById('roomCodeInput').value || '').trim().toUpperCase();
  const mode = document.getElementById('gameModeSelect').value;
  const team = document.getElementById('teamInput').value.trim();

  if (!name) return alert('Please enter your name');
  if (!roomCode) return alert('Please enter a room code');
  if (mode === 'team' && !team) return alert('Please enter your team name');

  const snap = await window.fbGet(window.fbRef(window.db, `buzz_rooms/${roomCode}`));
  if (!snap.exists()) return alert('Room not found! Check the 6-letter code.');

  const roomData = snap.val();
  userProfile = { name, team: roomData.mode === 'team' ? team : '', mode: roomData.mode };
  isHost = false;
  currentRoom = roomCode;

  const memberKey = getUserId();
  await window.fbUpdate(window.fbRef(window.db, `buzz_rooms/${roomCode}/members/${memberKey}`), {
    name,
    team: userProfile.team,
    lastActive: Date.now()
  });

  initPlayerUI(roomCode);
  listenToRoom(roomCode);
}

function initPlayerUI(roomCode) {
  document.getElementById('lobbyPage').classList.add('hidden');
  document.getElementById('hostPage').classList.add('hidden');
  document.getElementById('playerPage').classList.remove('hidden');
  document.getElementById('playerRoomCodeLabel').textContent = `ROOM: ${roomCode}`;
}

// Real-time synchronization
function listenToRoom(roomCode) {
  const roomRef = window.fbRef(window.db, `buzz_rooms/${roomCode}`);
  window.fbOnValue(roomRef, (snapshot) => {
    const room = snapshot.val();
    if (!room) {
      alert('The arena has ended.');
      leaveRoom();
      return;
    }

    renderRoomState(room);
  });
}

let lastFirstBuzzer = null;
let lastLockedState = true;

function renderRoomState(room) {
  const queue = Object.values(room.buzzQueue || {}).sort((a, b) => a.time - b.time);
  const first = queue[0] || null;

  // Sound triggers
  if (first && (!lastFirstBuzzer || lastFirstBuzzer.id !== first.id)) {
    playBuzzerSound('buzz');
    if (!isHost && first.userId === getUserId()) {
      confetti({ particleCount: 150, spread: 80 });
    }
  } else if (!room.locked && lastLockedState === true) {
    playBuzzerSound('unlock');
  }

  lastFirstBuzzer = first;
  lastLockedState = room.locked;

  // Winner text formulation
  let bannerText = 'Waiting for buzzes...';
  if (room.locked && !first) {
    bannerText = '🔒 Buzzers Locked by Host';
  } else if (first) {
    bannerText = room.mode === 'team'
      ? `⚡ [TEAM ${first.team.toUpperCase()}] ${first.name} BUZZED FIRST!`
      : `⚡ ${first.name.toUpperCase()} BUZZED FIRST!`;
  }

  if (isHost) {
    document.getElementById('hostWinnerBanner').textContent = bannerText;
    renderHostQueue(queue);
    renderScoreboard('hostScoreboard', room.scores || {}, room.mode);
  } else {
    document.getElementById('playerWinnerBanner').textContent = bannerText;
    const buzzerBtn = document.getElementById('buzzerBtn');
    const pill = document.getElementById('playerStatusPill');

    const alreadyBuzzed = queue.some(item => item.userId === getUserId());
    const isLocked = room.locked || alreadyBuzzed;

    buzzerBtn.disabled = isLocked;
    buzzerBtn.classList.toggle('locked', isLocked);

    if (room.locked) {
      pill.textContent = 'LOCKED';
      pill.className = 'status-pill locked';
    } else if (alreadyBuzzed) {
      pill.textContent = 'BUZZED';
      pill.className = 'status-pill';
    } else {
      pill.textContent = 'OPEN';
      pill.className = 'status-pill open';
    }

    renderScoreboard('playerScoreboard', room.scores || {}, room.mode);
  }
}

function renderHostQueue(queue) {
  const container = document.getElementById('hostBuzzQueue');
  if (!queue.length) {
    container.innerHTML = '<div style="color:var(--muted); text-align:center; padding:12px;">No buzzes this round</div>';
    return;
  }

  container.innerHTML = queue.map((item, index) => `
    <div class="queue-item">
      <div>
        <b>#${index + 1} ${item.mode === 'team' ? `[${escapeHtml(item.team)}] ` : ''}${escapeHtml(item.name)}</b>
      </div>
      <span style="font-size:0.85rem; color:var(--muted);">${index === 0 ? '🏆 1ST' : `+${((item.time - queue[0].time)/1000).toFixed(2)}s`}</span>
    </div>
  `).join('');
}

function renderScoreboard(targetId, scores, mode) {
  const container = document.getElementById(targetId);
  const entries = Object.entries(scores).sort((a, b) => b[1] - a[1]);

  if (!entries.length) {
    container.innerHTML = '<div style="color:var(--muted); grid-column: 1/-1; text-align:center;">No points awarded yet</div>';
    return;
  }

  container.innerHTML = entries.map(([key, pts]) => `
    <div class="score-card">
      <b>${escapeHtml(key)}</b>
      <div class="pts">${pts}</div>
    </div>
  `).join('');
}

// Atomic Buzzer Operation
async function triggerBuzz() {
  if (!currentRoom) return;
  const userId = getUserId();
  const roomRef = window.fbRef(window.db, `buzz_rooms/${currentRoom}`);

  try {
    await window.fbRunTransaction(roomRef, (room) => {
      if (!room || room.locked) return room;
      if (!room.buzzQueue) room.buzzQueue = {};

      // Check if user or team has already buzzed
      const existing = Object.values(room.buzzQueue);
      if (room.mode === 'team' && existing.some(item => item.team === userProfile.team)) {
        return room;
      }
      if (existing.some(item => item.userId === userId)) {
        return room;
      }

      const buzzId = 'buzz_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5);
      room.buzzQueue[buzzId] = {
        id: buzzId,
        userId: userId,
        name: userProfile.name,
        team: userProfile.team || '',
        mode: room.mode,
        time: Date.now()
      };

      return room;
    });
  } catch (err) {
    console.error('Buzz transaction failed:', err);
  }
}

// Host controls
async function unlockBuzzers() {
  if (!currentRoom || !isHost) return;
  await window.fbUpdate(window.fbRef(window.db, `buzz_rooms/${currentRoom}`), {
    locked: false,
    buzzQueue: {}
  });
}

async function lockBuzzers() {
  if (!currentRoom || !isHost) return;
  await window.fbUpdate(window.fbRef(window.db, `buzz_rooms/${currentRoom}`), {
    locked: true
  });
}

async function awardPoints(points) {
  if (!currentRoom || !isHost) return;
  const snap = await window.fbGet(window.fbRef(window.db, `buzz_rooms/${currentRoom}`));
  if (!snap.exists()) return;

  const room = snap.val();
  const queue = Object.values(room.buzzQueue || {}).sort((a, b) => a.time - b.time);
  if (!queue.length) return alert('No winner to award points to!');

  const winner = queue[0];
  const scoreKey = sanitize(room.mode === 'team' ? winner.team : winner.name);
  const currentScore = (room.scores && room.scores[scoreKey]) || 0;

  await window.fbUpdate(window.fbRef(window.db, `buzz_rooms/${currentRoom}/scores`), {
    [scoreKey]: Math.max(0, currentScore + points)
  });
}

async function resetAllScores() {
  if (!currentRoom || !isHost) return;
  if (!confirm('Reset all scores back to zero?')) return;
  await window.fbSet(window.fbRef(window.db, `buzz_rooms/${currentRoom}/scores`), {});
}

function copyJoinLink() {
  const url = new URL(window.location.href);
  url.searchParams.set('room', currentRoom);
  navigator.clipboard.writeText(url.toString()).then(() => alert('Direct room join link copied!'));
}

function leaveRoom() {
  location.href = window.location.pathname;
}

function escapeHtml(text) {
  return String(text || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// Keyboard shortcut (Space to buzz)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    const btn = document.getElementById('buzzerBtn');
    if (btn && !btn.disabled && !document.getElementById('playerPage').classList.contains('hidden')) {
      triggerBuzz();
    }
  }
});

// Auto-populate room from URL parameter
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const r = params.get('room');
  if (r) {
    document.getElementById('roomCodeInput').value = r.toUpperCase();
    showJoinBox();
  }
});
</script>
