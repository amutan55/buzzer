<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHIL QUIZ ARENA</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Orbitron',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.container{
width:95%;
max-width:1500px;
margin:auto;
padding:20px;
}

.hidden{
display:none!important;
}

.title{
text-align:center;
font-size:3rem;
font-weight:900;
margin:20px 0;
color:#00e5ff;
text-shadow:0 0 20px #00e5ff;
}

.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(12px);
border-radius:25px;
padding:25px;
margin-top:20px;
border:1px solid rgba(255,255,255,0.08);
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.profile{
display:flex;
align-items:center;
gap:15px;
}

.profile img{
width:65px;
height:65px;
border-radius:50%;
object-fit:cover;
border:3px solid #00e5ff;
}

.dashboard-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}

.big-btn{
height:140px;
font-size:1.4rem;
font-weight:900;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

input,
button,
textarea,
select{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:15px;
font-family:'Orbitron',sans-serif;
font-size:1rem;
}

input,
textarea,
select{
background:#111827;
color:white;
}

button{
background:linear-gradient(135deg,#00e5ff,#ff00d4);
color:white;
cursor:pointer;
font-weight:700;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.logout-btn{
background:red;
width:auto;
padding:12px 18px;
}

.back-btn{
background:#2563eb;
width:auto;
padding:12px 18px;
}

.avatar-preview{
width:120px;
height:120px;
border-radius:50%;
display:block;
margin:auto;
object-fit:cover;
border:4px solid #00e5ff;
}

.room-code{
font-size:2rem;
text-align:center;
color:#00e5ff;
margin-top:10px;
word-break:break-word;
}

.question{
font-size:2rem;
text-align:center;
margin-top:20px;
color:#00e5ff;
}

.buzzer{
width:240px;
height:240px;
border-radius:50%;
margin:30px auto;
display:block;
font-size:3rem;
font-weight:900;
background:radial-gradient(circle,#ffe600,#ff9800);
color:black;
box-shadow:0 0 50px #ffe600;
}

.locked{
background:#555!important;
box-shadow:none!important;
}

.player{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:rgba(255,255,255,0.05);
border-radius:16px;
margin-top:10px;
gap:10px;
}

.player-left{
display:flex;
align-items:center;
gap:12px;
}

.player-left img{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.timer{
text-align:center;
font-size:2rem;
margin-top:15px;
color:#ffe600;
}

.winner{
text-align:center;
font-size:1.4rem;
margin-top:15px;
color:#00ff99;
}

.question-image{
width:100%;
max-height:350px;
object-fit:contain;
margin-top:20px;
border-radius:20px;
display:none;
background:black;
}

.qr-box{
background:white;
padding:15px;
border-radius:20px;
width:230px;
margin:auto;
margin-top:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:230px;
}

.score-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.small-note{
text-align:center;
margin-top:12px;
font-size:.9rem;
color:#cbd5e1;
word-break:break-all;
}

@media(max-width:900px){
.dashboard-buttons{
grid-template-columns:1fr;
}

.grid{
grid-template-columns:1fr;
}

.title{
font-size:2rem;
}

.buzzer{
width:200px;
height:200px;
font-size:2rem;
}
}
</style>
</head>

<body>
<div class="container">
<h1 class="title">MAHIL QUIZ ARENA</h1>

<div id="loginPage" class="glass">
<h2>LOGIN</h2>
<input type="text" id="loginUsername" placeholder="Username">
<input type="password" id="loginPassword" placeholder="Password">
<button onclick="login()">LOGIN</button>
<button onclick="showSignup()">SIGN UP</button>
</div>

<div id="signupPage" class="glass hidden">
<div class="topbar">
<button class="back-btn" onclick="showLogin()">⬅ BACK</button>
</div>

<h2>CREATE ACCOUNT</h2>
<input type="text" id="signupUsername" placeholder="Username">
<input type="email" id="signupEmail" placeholder="Email">
<input type="password" id="signupPassword" placeholder="Password">

<img id="avatarPreview" class="avatar-preview" src="https://i.pravatar.cc/150?img=12" alt="Avatar preview">
<input type="file" id="avatarInput" accept="image/*">

<button onclick="signup()">CREATE ACCOUNT</button>
</div>

<div id="dashboard" class="glass hidden">
<div class="topbar">
<div class="profile">
<img id="profileAvatar" alt="Profile avatar">
<div>
<h2 id="profileName"></h2>
<p id="profileEmail"></p>
</div>
</div>

<button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>

<div class="dashboard-buttons">
<button class="big-btn" onclick="hostGame()">HOST GAME</button>
<button class="big-btn" onclick="openJoinPage()">PLAY GAME</button>
<button class="big-btn" onclick="openSettings()">SETTINGS</button>
<button class="big-btn" onclick="clearRooms()">CLEAR ROOMS</button>
</div>
</div>

<div id="joinPage" class="glass hidden">
<div class="topbar">
<button class="back-btn" onclick="goDashboard()">⬅ BACK</button>
<h2>JOIN ROOM</h2>
</div>

<input type="text" id="joinCode" placeholder="Enter Room Code">
<button onclick="joinGame()">JOIN ROOM</button>
</div>

<div id="settingsPage" class="glass hidden">
<div class="topbar">
<button class="back-btn" onclick="goDashboard()">⬅ BACK</button>
<h2>SETTINGS</h2>
</div>

<input type="text" id="changeName" placeholder="Change Username">
<input type="file" id="changeAvatar" accept="image/*">

<select id="soundSelect">
<option value="1">Classic Buzz</option>
<option value="2">Electric Buzz</option>
<option value="3">Game Show</option>
<option value="4">Laser Buzz</option>
<option value="5">Cyber Buzz</option>
</select>

<button onclick="saveSettings()">SAVE SETTINGS</button>
</div>

<div id="hostPage" class="glass hidden">
<div class="topbar">
<button class="back-btn" onclick="goDashboard()">⬅ BACK</button>
<h2>HOST PANEL</h2>
</div>

<div class="room-code" id="roomCode">ROOM CODE:</div>

<div class="qr-box">
<div id="qrcode"></div>
</div>

<div class="small-note" id="joinLinkNote"></div>

<textarea id="questionInput" placeholder="Enter Question"></textarea>
<input type="file" id="questionImageInput" accept="image/*">

<button onclick="sendQuestion()">SEND QUESTION</button>
<button onclick="resetBuzzers()">RESET BUZZERS</button>

<div class="score-buttons">
<button onclick="addPoints()">+10 POINTS</button>
<button onclick="minusPoints()">-10 POINTS</button>
</div>

<button onclick="startTimer()">START TIMER</button>

<div class="timer" id="timer">10</div>
<div class="winner" id="winner"></div>

<h2 style="margin-top:20px">LIVE SCOREBOARD</h2>
<div id="hostScoreboard"></div>
</div>

<div id="playerPage" class="hidden">
<div class="grid">
<div class="glass">
<div class="topbar">
<button class="back-btn" onclick="goDashboard()">⬅ BACK</button>
<button class="logout-btn" onclick="logout()">LOGOUT</button>
</div>

<div class="question" id="question">Waiting for question...</div>
<img id="questionImage" class="question-image" alt="Question image">

<button class="buzzer" id="buzzBtn" onclick="buzz()">BUZZ</button>

<div class="winner" id="reaction"></div>
<div class="winner" id="playerWinner"></div>
<div class="timer" id="playerTimer">10</div>
</div>

<div class="glass">
<h2>LIVE SCOREBOARD</h2>
<div id="playerScoreboard"></div>
</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  get,
  update,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_REAL_API_KEY",
  authDomain: "mahilbuzz-8d984.firebaseapp.com",
  databaseURL: "https://mahilbuzz-8d984-default-rtdb.firebaseio.com",
  projectId: "mahilbuzz-8d984",
  storageBucket: "mahilbuzz-8d984.firebasestorage.app",
  messagingSenderId: "364076231129",
  appId: "1:364076231129:web:538aad1882ce26704d11c8",
  measurementId: "G-JR0172JSE9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.fbRef = ref;
window.fbSet = set;
window.fbGet = get;
window.fbUpdate = update;
window.fbOnValue = onValue;
window.fbRemove = remove;

window.dispatchEvent(new Event("firebase-ready"));
</script>

<script>
let currentUser = null;
let currentRoom = '';
let timerInterval = null;
let roomListenerStartedFor = '';

const buzzSounds = {
  1:'https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3',
  2:'https://assets.mixkit.co/active_storage/sfx/1018/1018-preview.mp3',
  3:'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3',
  4:'https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3',
  5:'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'
};

document.getElementById('avatarInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(event){
      document.getElementById('avatarPreview').src = event.target.result;
    };
    reader.readAsDataURL(file);
  }
});

window.addEventListener('load', () => {
  const saved = localStorage.getItem('mahilCurrentUser');
  if(saved){
    currentUser = JSON.parse(saved);
    showDashboard();
  }

  const params = new URLSearchParams(window.location.search);
  const roomParam = params.get('room');
  if(roomParam){
    document.getElementById('joinCode').value = roomParam.toUpperCase();
  }
});

function hideAll(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('signupPage').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('joinPage').classList.add('hidden');
  document.getElementById('settingsPage').classList.add('hidden');
  document.getElementById('hostPage').classList.add('hidden');
  document.getElementById('playerPage').classList.add('hidden');
}

function showSignup(){
  hideAll();
  document.getElementById('signupPage').classList.remove('hidden');
}

function showLogin(){
  hideAll();
  document.getElementById('loginPage').classList.remove('hidden');
}

function signup(){
  const username = document.getElementById('signupUsername').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value.trim();
  const avatar = document.getElementById('avatarPreview').src;

  if(!username || !email || !password){
    alert('Fill all fields');
    return;
  }

  let users = JSON.parse(localStorage.getItem('mahilUsers')) || [];

  if(users.find(u => u.username === username)){
    alert('Username Exists');
    return;
  }

  users.push({
    username,
    email,
    password,
    avatar,
    sound:'1'
  });

  localStorage.setItem('mahilUsers', JSON.stringify(users));
  alert('Account Created');
  showLogin();
}

function login(){
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const users = JSON.parse(localStorage.getItem('mahilUsers')) || [];

  const user = users.find(u => u.username === username && u.password === password);

  if(!user){
    alert('Invalid Login');
    return;
  }

  currentUser = user;
  localStorage.setItem('mahilCurrentUser', JSON.stringify(currentUser));
  showDashboard();

  const prefill = document.getElementById('joinCode').value.trim();
  if(prefill){
    openJoinPage();
  }
}

function showDashboard(){
  hideAll();
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('profileAvatar').src = currentUser.avatar;
  document.getElementById('profileName').innerText = currentUser.username;
  document.getElementById('profileEmail').innerText = currentUser.email;
}

function logout(){
  localStorage.removeItem('mahilCurrentUser');
  location.reload();
}

function goDashboard(){
  showDashboard();
}

function openSettings(){
  hideAll();
  document.getElementById('settingsPage').classList.remove('hidden');
  document.getElementById('changeName').value = currentUser.username;
  document.getElementById('soundSelect').value = currentUser.sound || '1';
}

function saveSettings(){
  const newName = document.getElementById('changeName').value.trim();
  const sound = document.getElementById('soundSelect').value;

  if(newName){
    currentUser.username = newName;
  }

  currentUser.sound = sound;

  const avatarFile = document.getElementById('changeAvatar').files[0];

  if(avatarFile){
    const reader = new FileReader();
    reader.onload = function(event){
      currentUser.avatar = event.target.result;
      finishSave();
    };
    reader.readAsDataURL(avatarFile);
  } else {
    finishSave();
  }
}

function finishSave(){
  let users = JSON.parse(localStorage.getItem('mahilUsers')) || [];
  users = users.map(u => u.email === currentUser.email ? currentUser : u);
  localStorage.setItem('mahilUsers', JSON.stringify(users));
  localStorage.setItem('mahilCurrentUser', JSON.stringify(currentUser));
  alert('Saved');
  location.reload();
}

function openJoinPage(){
  hideAll();
  document.getElementById('joinPage').classList.remove('hidden');
}

function waitForFirebase(){
  return new Promise(resolve => {
    if(window.db && window.fbRef){
      resolve();
    } else {
      window.addEventListener("firebase-ready", resolve, { once:true });
    }
  });
}

async function hostGame(){
  await waitForFirebase();

  try{
    hideAll();
    document.getElementById('hostPage').classList.remove('hidden');

    const roomCode = generateRoomCode();
    currentRoom = roomCode;

    await fbSet(
      fbRef(db, 'rooms/' + roomCode),
      {
        host: currentUser.username,
        roomCode: roomCode,
        question: '',
        questionImage: '',
        winner: '',
        buzzed: false,
        reaction: '',
        timer: 10,
        createdAt: Date.now(),
        players: {
          [sanitizeKey(currentUser.email)]: {
            username: currentUser.username,
            email: currentUser.email,
            avatar: currentUser.avatar,
            sound: currentUser.sound || '1',
            score: 0
          }
        }
      }
    );

    document.getElementById('roomCode').textContent = 'ROOM CODE: ' + roomCode;

    const joinURL = new URL(window.location.href);
    joinURL.searchParams.set('room', roomCode);

    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';

    new QRCode(qrContainer, {
      text: joinURL.toString(),
      width: 200,
      height: 200,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById('joinLinkNote').textContent = joinURL.toString();

    attachRoomListener();
    alert('Room created: ' + roomCode);
  }catch(error){
    console.error(error);
    alert('Failed to create room: ' + error.message);
  }
}

async function joinGame(){
  await waitForFirebase();

  try{
    const code = document.getElementById('joinCode').value.trim().toUpperCase();

    if(!code){
      alert('Enter Room Code');
      return;
    }

    const snap = await fbGet(fbRef(db, 'rooms/' + code));

    if(!snap.exists()){
      alert('Room Not Found');
      return;
    }

    currentRoom = code;

    await fbUpdate(
      fbRef(db, 'rooms/' + code + '/players'),
      {
        [sanitizeKey(currentUser.email)]: {
          username: currentUser.username,
          email: currentUser.email,
          avatar: currentUser.avatar,
          sound: currentUser.sound || '1',
          score: 0
        }
      }
    );

    hideAll();
    document.getElementById('playerPage').classList.remove('hidden');

    attachRoomListener();

    alert('Joined Room ' + code);
  }catch(error){
    console.error(error);
    alert('Join failed: ' + error.message);
  }
}

async function sendQuestion(){
  await waitForFirebase();

  try{
    const q = document.getElementById('questionInput').value.trim();
    const file = document.getElementById('questionImageInput').files[0];

    if(!currentRoom){
      alert('No active room');
      return;
    }

    let questionImage = '';

    if(file){
      questionImage = await fileToBase64(file);
    }

    await fbUpdate(
      fbRef(db, 'rooms/' + currentRoom),
      {
        question: q,
        questionImage: questionImage,
        winner: '',
        buzzed: false,
        reaction: '',
        timer: 10
      }
    );
  }catch(error){
    console.error(error);
    alert('Failed to send question: ' + error.message);
  }
}

async function buzz(){
  await waitForFirebase();

  try{
    if(!currentRoom) return;

    const snap = await fbGet(fbRef(db, 'rooms/' + currentRoom));
    if(!snap.exists()) return;

    const room = snap.val();
    if(room.buzzed) return;

    const reaction = (Math.random() * 1.5 + 0.2).toFixed(3);

    await fbUpdate(
      fbRef(db, 'rooms/' + currentRoom),
      {
        buzzed: true,
        winner: currentUser.username,
        reaction: reaction
      }
    );

    const sound = new Audio(buzzSounds[currentUser.sound || '1']);
    sound.play();

    confetti({
      particleCount:220,
      spread:140
    });
  }catch(error){
    console.error(error);
  }
}

async function resetBuzzers(){
  await waitForFirebase();

  try{
    if(!currentRoom) return;

    await fbUpdate(
      fbRef(db, 'rooms/' + currentRoom),
      {
        buzzed: false,
        winner: '',
        reaction: '',
        timer: 10
      }
    );
  }catch(error){
    console.error(error);
  }
}

async function addPoints(){
  await changeWinnerScore(10);
}

async function minusPoints(){
  await changeWinnerScore(-10);
}

async function changeWinnerScore(delta){
  await waitForFirebase();

  try{
    if(!currentRoom) return;

    const snap = await fbGet(fbRef(db, 'rooms/' + currentRoom));
    if(!snap.exists()) return;

    const room = snap.val();
    const players = room.players || {};
    const winnerName = room.winner;

    let winnerKey = null;

    for(const key in players){
      if(players[key].username === winnerName){
        winnerKey = key;
        break;
      }
    }

    if(winnerKey){
      const currentScore = players[winnerKey].score || 0;
      await fbUpdate(
        fbRef(db, 'rooms/' + currentRoom + '/players/' + winnerKey),
        { score: currentScore + delta }
      );
    }
  }catch(error){
    console.error(error);
  }
}

function updateBoards(room){
  const players = Object.values(room.players || {}).sort((a,b)=>(b.score||0)-(a.score||0));

  let html = '';

  players.forEach(player => {
    html += `
      <div class="player">
        <div class="player-left">
          <img src="${player.avatar}" alt="${player.username}">
          <div>
            <b>${player.username}</b><br>
            <small>${player.email}</small>
          </div>
        </div>
        <div style="font-size:1.2rem">${player.score || 0} pts</div>
      </div>
    `;
  });

  document.getElementById('hostScoreboard').innerHTML = html;
  document.getElementById('playerScoreboard').innerHTML = html;
}

function attachRoomListener(){
  if(!currentRoom) return;
  if(roomListenerStartedFor === currentRoom) return;

  roomListenerStartedFor = currentRoom;

  fbOnValue(fbRef(db, 'rooms/' + currentRoom), snapshot => {
    const room = snapshot.val();
    if(!room) return;

    document.getElementById('roomCode').textContent = 'ROOM CODE: ' + (room.roomCode || currentRoom);
    document.getElementById('question').innerText = room.question || 'Waiting for question...';

    const img = document.getElementById('questionImage');
    if(room.questionImage){
      img.src = room.questionImage;
      img.style.display = 'block';
    }else{
      img.style.display = 'none';
    }

    updateBoards(room);

    if(room.winner){
      document.getElementById('playerWinner').innerHTML = '⚡ ' + room.winner + ' BUZZED FIRST';
      document.getElementById('winner').innerHTML = '⚡ ' + room.winner + ' BUZZED FIRST';
      document.getElementById('buzzBtn').disabled = true;
      document.getElementById('buzzBtn').classList.add('locked');

      if(room.reaction){
        document.getElementById('reaction').innerHTML = 'Reaction Time: ' + room.reaction + 's';
      }
    }else{
      document.getElementById('playerWinner').innerHTML = '';
      document.getElementById('winner').innerHTML = '';
      document.getElementById('reaction').innerHTML = '';
      document.getElementById('buzzBtn').disabled = false;
      document.getElementById('buzzBtn').classList.remove('locked');
    }

    document.getElementById('timer').innerHTML = room.timer ?? 10;
    document.getElementById('playerTimer').innerHTML = room.timer ?? 10;
  });
}

async function startTimer(){
  await waitForFirebase();

  try{
    if(!currentRoom) return;

    clearInterval(timerInterval);

    let time = 10;
    await fbUpdate(fbRef(db, 'rooms/' + currentRoom), { timer: time });

    timerInterval = setInterval(async () => {
      time--;
      await fbUpdate(fbRef(db, 'rooms/' + currentRoom), { timer: time });
      if(time <= 0){
        clearInterval(timerInterval);
      }
    }, 1000);
  }catch(error){
    console.error(error);
  }
}

async function clearRooms(){
  await waitForFirebase();

  try{
    await fbRemove(fbRef(db, 'rooms'));
    alert('All rooms cleared');
  }catch(error){
    console.error(error);
    alert('Failed to clear rooms: ' + error.message);
  }
}

function sanitizeKey(email){
  return email.replace(/[.#$[\]]/g, '_');
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function generateRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for(let i = 0; i < 6; i++){
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return code;
}
